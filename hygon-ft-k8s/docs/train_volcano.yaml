# IMPORTANT: This file contains placeholder training images and an
# environment-specific filesystem layout. Before deployment, replace every
# trainer image below with an HCU image accessible from your cluster, and adapt
# all /public/home/user paths, wheels, datasets, and hostPath volumes to your
# own environment.
# Stable rendezvous endpoint. This service selects only the rank-0 pod, so
# torchrun does not depend on per-pod headless DNS records.
apiVersion: v1
kind: Service
metadata:
  name: megatron-master
  namespace: default
spec:
  selector:
    app: megatron-train
    role: master
  ports:
  - name: training
    port: 29611
    targetPort: 29611
  publishNotReadyAddresses: true
---
# Runtime configuration injected into every training pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hcu-megatron
  namespace: default
data:
  MEGATRON_PATH: "/public/home/user/code/hcu_megatron"
  DATA_PATH: "/public/home/user/datasets/redpajama_text_document/redpajama_text_document"
  TOKENIZER_MODEL_PATH: "/public/home/user/datasets/redpajama_text_document/tokenizer.model"
  CHECKPOINT_PATH: "/public/home/user/ckpt2"
  WORK_DIR: "/public/home/user/code/hcu_megatron/examples/gpt3"
  TRAIN_SCRIPT: "/public/home/user/code/hcu_megatron/examples/gpt3/train_gpt_torch.sh"
  NNODES: "2"
  MASTER_ADDR: "megatron-master.default.svc.cluster.local"
  MASTER_PORT: "29611"
  NPROC_PER_NODE: "8"
---
# Volcano Job. Any worker Pod failure/eviction restarts the whole job, so
# Megatron reloads from checkpoint instead of mixing old and new communicator generations.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: megatron-train-job
  namespace: default
  labels:
    ft.hygon.io/enabled: "true"
  annotations:
    ft.hygon.io/enabled: "true"
spec:
  minAvailable: 2
  schedulerName: volcano
  maxRetry: 1000
  tasks:
  - name: master
    replicas: 1
    policies:
    - events:
      - PodEvicted
      - PodFailed
      action: RestartJob
    template:
      metadata:
        labels:
          app: megatron-train
          role: master
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        nodeSelector:
          node-role.hygon.io/training: "true"
        containers:
        - name: trainer
          # Placeholder only; replace it with an equivalent HCU training image.
          image: your-registry.example.com/your-project/hcu-pytorch:2.9.0-ubuntu22.04-dtk26.04-py3.10
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -lc
                - |
                  pkill -TERM -P 1 || true
                  sleep 5
                  pkill -KILL -P 1 || true
          envFrom:
          - configMapRef:
              name: hcu-megatron
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail

            pip install /public/home/user/wheel/hcusmi-1.0.0+a788f784-py3-none-any.whl

            pip install /public/home/user/wheel/transformer_engine-2.10.0+das.opt1.dtk2604.torch290-cp310-cp310-manylinux_2_28_x86_64.whl

            pip install /public/home/user/wheel/pybind11-3.0.4-py3-none-any.whl

            cd "${WORK_DIR}"

            export NODE_RANK="0"

            LOG_DIR="./tmp"
            mkdir -p "${LOG_DIR}"
            LOG_FILE="${LOG_DIR}/node-${NODE_RANK}-$(date +%Y%m%d-%H%M%S).log"
            exec &> >(tee -a "${LOG_FILE}")

            echo "Pod name: ${POD_NAME}"
            echo "Node rank: ${NODE_RANK}, Master: ${MASTER_ADDR}:${MASTER_PORT}"
            exec bash "${TRAIN_SCRIPT}"
          resources:
            limits:
              hygon.com/hcu: 8
              memory: "128Gi"
              cpu: "8"
            requests:
              hygon.com/hcu: 8
              memory: "128Gi"
              cpu: "8"
          volumeMounts:
          - name: workspace
            mountPath: /public/home/user
            readOnly: false
          - name: shm
            mountPath: /dev/shm
          # run_nhc is a wrapper that calls these absolute host paths.
          - name: gridview-python
            mountPath: /opt/gridview/agent/python3.12.12
            readOnly: true
          - name: node-check
            mountPath: /opt/gridview/agent/external/check/node_check
            readOnly: true
          - name: run-nhc
            mountPath: /usr/local/bin/run_nhc
            readOnly: true
          # Keep the host installation read-only while allowing node_check to log.
          - name: nhc-log
            mountPath: /opt/gridview/agent/external/check/node_check/log
        volumes:
        - name: workspace
          hostPath:
            path: /public/home/user
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 400Gi
        - name: gridview-python
          hostPath:
            path: /opt/gridview/agent/python3.12.12
            type: Directory
        - name: node-check
          hostPath:
            path: /opt/gridview/agent/external/check/node_check
            type: Directory
        - name: run-nhc
          hostPath:
            path: /usr/local/bin/run_nhc
            type: File
        - name: nhc-log
          emptyDir: {}
  - name: worker
    replicas: 1
    policies:
    - events:
      - PodEvicted
      - PodFailed
      action: RestartJob
    template:
      metadata:
        labels:
          app: megatron-train
          role: worker
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        nodeSelector:
          node-role.hygon.io/training: "true"
        containers:
        - name: trainer
          # Placeholder only; replace it with an equivalent HCU training image.
          image: your-registry.example.com/your-project/hcu-pytorch:2.9.0-ubuntu22.04-dtk26.04-py3.10
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -lc
                - |
                  pkill -TERM -P 1 || true
                  sleep 5
                  pkill -KILL -P 1 || true
          envFrom:
          - configMapRef:
              name: hcu-megatron
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail

            pip install /public/home/user/wheel/hcusmi-1.0.0+a788f784-py3-none-any.whl

            pip install /public/home/user/wheel/transformer_engine-2.10.0+das.opt1.dtk2604.torch290-cp310-cp310-manylinux_2_28_x86_64.whl

            pip install /public/home/user/wheel/pybind11-3.0.4-py3-none-any.whl

            cd "${WORK_DIR}"

            ORDINAL="${POD_NAME##*-}"
            if [[ ! "${ORDINAL}" =~ ^[0-9]+$ ]]; then
              echo "Cannot derive NODE_RANK from POD_NAME=${POD_NAME}" >&2
              exit 1
            fi
            export NODE_RANK="$((ORDINAL + 1))"

            LOG_DIR="./tmp"
            mkdir -p "${LOG_DIR}"
            LOG_FILE="${LOG_DIR}/node-${NODE_RANK}-$(date +%Y%m%d-%H%M%S).log"
            exec &> >(tee -a "${LOG_FILE}")

            echo "Pod name: ${POD_NAME}"
            echo "Node rank: ${NODE_RANK}, Master: ${MASTER_ADDR}:${MASTER_PORT}"
            exec bash "${TRAIN_SCRIPT}"
          resources:
            limits:
              hygon.com/hcu: 8
              memory: "128Gi"
              cpu: "8"
            requests:
              hygon.com/hcu: 8
              memory: "128Gi"
              cpu: "8"
          volumeMounts:
          - name: workspace
            mountPath: /public/home/user
            readOnly: false
          - name: shm
            mountPath: /dev/shm
          - name: gridview-python
            mountPath: /opt/gridview/agent/python3.12.12
            readOnly: true
          - name: node-check
            mountPath: /opt/gridview/agent/external/check/node_check
            readOnly: true
          - name: run-nhc
            mountPath: /usr/local/bin/run_nhc
            readOnly: true
          - name: nhc-log
            mountPath: /opt/gridview/agent/external/check/node_check/log
        volumes:
        - name: workspace
          hostPath:
            path: /public/home/user
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 400Gi
        - name: gridview-python
          hostPath:
            path: /opt/gridview/agent/python3.12.12
            type: Directory
        - name: node-check
          hostPath:
            path: /opt/gridview/agent/external/check/node_check
            type: Directory
        - name: run-nhc
          hostPath:
            path: /usr/local/bin/run_nhc
            type: File
        - name: nhc-log
          emptyDir: {}
