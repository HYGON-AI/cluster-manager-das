# Four-node Llama/Megatron example for Volcano Job.
# Replace the training image and every /path/to/shared_root value before use.
apiVersion: v1
kind: Service
metadata:
  name: llama-volcano-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: llama-volcano-train
  ports:
    - name: training
      port: 29511
      targetPort: 29511
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: Service
metadata:
  name: llama-volcano-master
  namespace: default
spec:
  selector:
    app: llama-volcano-train
    role: master
  ports:
    - name: training
      port: 29511
      targetPort: 29511
  publishNotReadyAddresses: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-volcano-env
  namespace: default
data:
  WORK_DIR: "/workspace/hcu_megatron/examples/llama3"
  TRAIN_SCRIPT: "/workspace/hcu_megatron/examples/llama3/train_llama3_8B_torchrun.sh"
  DATA_PATH: "/workspace/datasets/llama3"
  TOKENIZER_MODEL_PATH: "/workspace/datasets/llama3/tokenizer.model"
  CHECKPOINT_PATH: "/workspace/checkpoints/llama3"
  TRAIN_LOG_DIR: "/workspace/logs"
  NNODES: "4"
  MASTER_PORT: "29511"
  NPROC_PER_NODE: "8"
  TORCHINDUCTOR_WORKER_START: "spawn"
  TORCHINDUCTOR_COMPILE_THREADS: "1"
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: llama-megatron-volcano
  namespace: default
  labels:
    ft.hygon.io/enabled: "true"
  annotations:
    ft.hygon.io/enabled: "true"
    ft.hygon.io/inject-launcher: "true"
    ft.hygon.io/log-dir: "/workspace/hygon-ft-logs"
    ft.hygon.io/log-monitor-roles: "all"
    ft.hygon.io/log-monitor-command: >-
      python /workspace/hcu_cluster_manager/cluster_manager/cluster_manager/monitor/log_monitor.py
      --log-file "${FT_LOG_FILE}" --mode k8s
    ft.hygon.io/exit-after-fault-event-report: "true"
spec:
  minAvailable: 4
  schedulerName: volcano
  maxRetry: 1000
  tasks:
    - name: master
      replicas: 1
      policies:
        - events:
            - PodEvicted
            - PodFailed
          action: RestartJob
      template:
        metadata:
          labels:
            app: llama-volcano-train
            role: master
        spec:
          nodeSelector:
            node-role.hygon.io/training: "true"
          subdomain: llama-volcano-headless
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - llama-volcano-train
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: trainer
              image: registry.example.com/hcu-training/megatron:tag
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/bash
                      - -lc
                      - |
                        pkill -TERM -P 1 || true
                        sleep 5
                        pkill -KILL -P 1 || true
              envFrom:
                - configMapRef:
                    name: llama-volcano-env
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: MASTER_ADDR
                  value: llama-volcano-master
                - name: MASTER_PORT
                  value: "29511"
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  if [[ -f /opt/dtk/env.sh ]]; then
                    source /opt/dtk/env.sh
                  fi
                  cd "${WORK_DIR}"

                  export NODE_RANK="0"
                  mkdir -p "${TRAIN_LOG_DIR}"
                  LOG_FILE="${TRAIN_LOG_DIR}/node-${NODE_RANK}-$(date +%Y%m%d-%H%M%S).log"
                  exec &> >(tee -a "${LOG_FILE}")

                  echo "Pod name: ${POD_NAME}"
                  echo "Node rank: ${NODE_RANK}, Master: ${MASTER_ADDR}:${MASTER_PORT}"
                  exec bash "${TRAIN_SCRIPT}"
              resources:
                limits:
                  hygon.com/hcu: 8
                  memory: 128Gi
                  cpu: "8"
                requests:
                  hygon.com/hcu: 8
                  memory: 64Gi
                  cpu: "8"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: workspace
              hostPath:
                path: /path/to/shared_root
                type: Directory
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
    - name: worker
      replicas: 3
      policies:
        - events:
            - PodEvicted
            - PodFailed
          action: RestartJob
      template:
        metadata:
          labels:
            app: llama-volcano-train
            role: worker
        spec:
          nodeSelector:
            node-role.hygon.io/training: "true"
          subdomain: llama-volcano-headless
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - llama-volcano-train
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: trainer
              image: registry.example.com/hcu-training/megatron:tag
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/bash
                      - -lc
                      - |
                        pkill -TERM -P 1 || true
                        sleep 5
                        pkill -KILL -P 1 || true
              envFrom:
                - configMapRef:
                    name: llama-volcano-env
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: MASTER_ADDR
                  value: llama-volcano-master
                - name: MASTER_PORT
                  value: "29511"
              command:
                - /bin/bash
                - -c
              args:
                - |
                  set -euo pipefail
                  if [[ -f /opt/dtk/env.sh ]]; then
                    source /opt/dtk/env.sh
                  fi
                  cd "${WORK_DIR}"

                  ORDINAL="${POD_NAME##*-}"
                  if [[ ! "${ORDINAL}" =~ ^[0-9]+$ ]]; then
                    echo "Cannot derive NODE_RANK from POD_NAME=${POD_NAME}" >&2
                    exit 1
                  fi
                  export NODE_RANK="$((ORDINAL + 1))"

                  mkdir -p "${TRAIN_LOG_DIR}"
                  LOG_FILE="${TRAIN_LOG_DIR}/node-${NODE_RANK}-$(date +%Y%m%d-%H%M%S).log"
                  exec &> >(tee -a "${LOG_FILE}")

                  echo "Pod name: ${POD_NAME}"
                  echo "Node rank: ${NODE_RANK}, Master: ${MASTER_ADDR}:${MASTER_PORT}"
                  exec bash "${TRAIN_SCRIPT}"
              resources:
                limits:
                  hygon.com/hcu: 8
                  memory: 128Gi
                  cpu: "8"
                requests:
                  hygon.com/hcu: 8
                  memory: 64Gi
                  cpu: "8"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: workspace
              hostPath:
                path: /path/to/shared_root
                type: Directory
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
