apiVersion: v1
kind: ServiceAccount
metadata:
  name: ft-operator
  namespace: hygon-ft
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ft-webhook
  namespace: hygon-ft
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodehealth-agent
  namespace: hygon-ft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hygon-ft-operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["ft.hygon.io"]
    resources: ["faultevents"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["ft.hygon.io"]
    resources: ["faultevents/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hygon-ft-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hygon-ft-operator
subjects:
  - kind: ServiceAccount
    name: ft-operator
    namespace: hygon-ft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hygon-ft-nodehealth
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["ft.hygon.io"]
    resources: ["faultevents"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hygon-ft-nodehealth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hygon-ft-nodehealth
subjects:
  - kind: ServiceAccount
    name: nodehealth-agent
    namespace: hygon-ft
